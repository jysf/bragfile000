  - id: summary-grouping-heuristics
    question: "How does `brag summary --range week` decide on grouping order (project first vs type first vs tag first) when an entry has all three?"
    priority: low
    status: open
    raised_by: claude
    raised_at: 2026-04-19
    assigned_to: null
    notes: |
      Lands in STAGE-003. Leaning toward: always group by `project`
      first, then `type` second, with tags shown inline per entry.
      Make this choice when writing the summary spec — not now.

  - id: project-state-note-shape
    question: "Should a project's state/next-action note stay a single free-text `state_note` column, or split into structured `state` + `next_action` fields?"
    priority: medium
    status: answered
    raised_by: claude
    raised_at: 2026-06-08
    assigned_to: null
    answered_by: SPEC-030 (2026-06-09)
    notes: |
      Filed at SPEC-027 design (DEC-017, confidence 0.80 composite; this
      sub-choice ~0.78, the one piece below 0.8). DEC-017 locks a single
      free-text `state_note TEXT NOT NULL DEFAULT ''` column in the
      `0004_add_projects` migration as the minimal primitive — the user
      writes "Shipped tags; next: cut v0.2.0" freely. Resolve at SPEC-030
      design (the `brag project status` dashboard) BEFORE the dashboard
      renders the note: if the dashboard wants to surface "next action"
      distinctly from "state," a split is warranted. Under forward-only
      migrations (DEC-002) splitting later is an additive column +
      one-shot copy, not a rebuild — so deferring is cheap and YAGNI
      favors holding the single column until a renderer needs structure.

      Answered by SPEC-030 (2026-06-09), LD3: **keep single free-text
      column.** The dashboard — the named consumer that was meant to force
      this question — renders the note fine as a single column: truncated
      to 50 runes + "…" in the plain tab-separated row, carried in full in
      the `--format json` output. A one-row-per-project dashboard needs
      *less* structure than `brag project show` (which already renders the
      note as one labeled `State note:` line and reads fine), not more;
      splitting into `state` + `next_action` would either cram two columns
      into a terminal row or be re-concatenated for display (defeating the
      split). No `0005` migration, no DEC amendment — DEC-017 already
      records the single-column choice and this confirms it. Revisit
      trigger unchanged: if a future renderer genuinely needs to surface
      "next action" distinctly, it is a cheap additive column + one-shot
      copy superseding DEC-017's note sub-choice.

  - id: impact-window-calendar-vs-rolling
    question: "Should `brag impact --quarter|--month|--year` use calendar periods (current in-progress quarter/month/year) or rolling windows (now - 90/30/365 days) like `brag summary`?"
    priority: medium
    status: resolved
    raised_by: claude
    raised_at: 2026-07-06
    resolved_at: 2026-07-06
    resolved_by: orchestrator + user sign-off
    resolution: |
      CALENDAR periods, current-in-progress-period-to-date. Confirmed at
      SPEC-048 build by orchestrator sign-off, validated by the user
      (companies report by calendar quarter). `--quarter`/`--month`/`--year`
      compute the period start via `time.Date` constructors (never day
      subtraction), `--since` reuses DEC-008 `ParseSince`. The load-bearing
      divergence is enforced by TestImpactCmd_CalendarNotRolling (the
      quarter-start entry is IN, the day-before is OUT — which fails under a
      rolling now-90d reading). A `--previous` (last-completed-period)
      modifier is explicitly deferred to FUTURE scope, NOT implemented now,
      and the design does not foreclose it. Revisit only if STAGE-012's
      `brag story --audience` needs a trailing-window reading for some
      audience — add a rolling modifier then rather than flip the default.
    assigned_to: null
    notes: |
      Filed at SPEC-048 design (DEC-028, confidence 0.78 composite; this
      window-semantics sub-choice is the piece below 0.8 that drags the
      average — the envelope-inheritance sub-choices are 0.85-0.9). DEC-028
      locks CALENDAR periods, deliberately diverging from DEC-014 choice (6)
      which locks ROLLING windows for `brag summary`/`review`. Rationale:
      `brag impact` feeds the v0.4.0 story surface (STAGE-012 `brag story
      --audience`), whose audiences (manager/skip/exec) think in reporting
      periods — "what did you ship this quarter?" means the calendar
      quarter, not a trailing 90 days. Rolling is defensible and simpler;
      a user could reasonably expect either. Resolve/confirm when STAGE-012
      wires the story surface onto this digest: if `brag story` needs the
      trailing-window reading for any audience, revisit (add a rolling
      modifier rather than flip the default). Second, related soft spot:
      DEC-028 chose the CURRENT in-progress period (up to now), not the
      previous COMPLETE one; a `--previous` modifier is the clean future
      addition if the complete-period workflow materializes. Neither
      changes the schema — both are flag/semantics-only.

  - id: story-profile-override-file-format
    question: "What is the exact file format, config path, and precedence for user-defined `brag story` audience shaping profiles (the override layer over the bundled defaults)?"
    priority: medium
    status: resolved
    raised_by: claude
    raised_at: 2026-07-06
    resolved_at: 2026-07-06
    resolved_by: orchestrator sign-off (SPEC-049 build)
    assigned_to: null
    resolution: |
      LOCKED at SPEC-049 build by orchestrator sign-off. (a) Format: a
      flat `key: value` file with no nesting/lists, parsed by a hand-rolled
      stdlib `bufio` parser (≈30 lines) — NO new YAML dependency
      (`no-new-top-level-deps-without-decision` kept clean; go.mod carries
      no YAML dep). Keys: name, default_window, impact_threads_only,
      drop_impactless_beats, fold_small_threads, thread_order, candor,
      directive. Unknown keys and non-boolean booleans are errors (typo
      protection). (b) Path: `~/.bragfile/story-profiles/<name>.yaml`,
      resolved through an injectable package-var seam (`story.overrideDir`)
      for tests. (c) Precedence: OVERRIDE-WINS by name — a user
      `<name>.yaml` fully shadows the bundled default of the same name (no
      field-merge). (d) Malformed handling: REJECT with an error naming the
      file — NO silent fallback to the bundled default (AC-9). Paired
      tests: TestLoadProfile_BundledDefaults / _UserOverrideShadowsBundled
      / _UnknownAndMalformed (all green). The override path stays lightly
      exercised until a genuine third-party profile appears (SPEC-050's
      manager/skip ship as bundled defaults, not user-override files);
      revisit the merge-vs-replace + nested-config question only if a real
      profile needs nested/list config, which then requires a DEC for a
      YAML dep. The extension file suffix stays `.yaml` even though the
      parser is a subset — a real YAML file with only flat keys parses
      identically, so upgrading to a YAML engine later is non-breaking.
    notes: |
      Filed at SPEC-049 design (DEC-029, composite confidence 0.72). The
      profiles-as-DATA *mechanism* is high-confidence and locked (DEC-029
      choice 2): a profile = selection filter + threading policy +
      altitude/length + framing-directive pointer, sourced from a bundled
      default asset (embed.FS) with an optional user override. What is
      below 0.8 is the *concrete surface*: (a) the override file format —
      YAML is the lean; JSON/TOML are alternatives; (b) the path —
      `~/.bragfile/story-profiles/<name>.yaml` vs a `config`-dir location
      vs a single `story-profiles.yaml` map file; (c) precedence when a
      user file shadows a bundled default name (override-wins vs
      merge-fields); (d) malformed/partial-profile handling (reject vs
      fall back to default vs merge). SPEC-049 SHIPS the bundled `me`/`exec`
      defaults and the loader that reads them; it specifies the override
      path + format + precedence as a locked design decision so build does
      not guess, but the surface is new (no prior config-file-as-data
      precedent in the repo beyond flags + embedded migrations), hence the
      confidence flag. Resolve/harden when the first real user profile is
      authored (SPEC-050 `manager`/`skip` are shipped-as-bundled-defaults,
      NOT user-override files, so they exercise the loader but not the
      override precedence — the override path stays lightly exercised until
      a genuine third-party profile appears).

  - id: story-two-audience-slice-proves-divergence
    question: "Do the two shipped audiences (`me`, `exec`) prove `brag story`'s 'same in theory, diverge in practice' thesis convincingly, or does the release need `manager` too to be persuasive?"
    priority: medium
    status: resolved
    raised_by: claude
    raised_at: 2026-07-06
    resolved_at: 2026-07-06
    resolved_by: orchestrator sign-off (SPEC-049 build)
    assigned_to: null
    resolution: |
      RESOLVED at SPEC-049 build by orchestrator sign-off: ship the
      gradient ENDPOINTS `me` and `exec` now; the middle (`manager`/`skip`)
      lands in SPEC-050 as config-only bundled defaults (the zero-Go-change
      extensibility proof). The endpoints prove the thesis convincingly —
      the live me-vs-exec run over the SAME corpus produces demonstrably
      different bundles by RULE, not tone: `me` = 4 threads / Beats 6/6 /
      impact-less beats + the (no project) thread KEPT / alpha-ASC order;
      `exec` = 3 threads / Beats 4/6 / impact-less beats DROPPED + the
      (no project) thread FOLDED / impact-beat-count-DESC order (beta
      leads). That divergence lives in the deterministic body (threads,
      beats, throughline), not only the framing directive, and is locked by
      byte-exact goldens (Tests 1/2/3) + the live-DB assertion (Test 15).
      The mechanism is data-driven, so pulling `manager` forward would have
      been additive config with zero mechanism change — deferring it does
      not weaken the headline. `manager` in SPEC-050 then demonstrates the
      extensibility claim explicitly (adding an audience touches no Go).
    notes: |
      Filed at SPEC-049 design (DEC-029 choice 4). SPEC-049 ships the
      gradient ENDPOINTS — `me` (candid / every thread / impact-less beats
      kept / low altitude / many arcs) and `exec` (promotional / impact-
      bearing threads only / small threads folded / impact-less beats
      dropped / high altitude / one headline arc) — because the endpoints
      maximally exercise the mechanism and give the sharpest byte-golden
      contrast. The open question is whether shipping only the endpoints
      reads as "we built two hard-coded modes" rather than "we built an
      extensible gradient." Mitigations already in the design: (1) the
      mechanism is data-driven, so `manager` is a config-only addition;
      (2) SPEC-050 adds `manager`/`skip` explicitly to DEMONSTRATE the
      zero-Go-change extensibility. If the orchestrator judges two
      endpoints insufficient for the v0.4.0 narrative headline, pull
      `manager` forward into SPEC-049 (it is additive config; it does not
      change the mechanism or the bundle shape). Recorded so the
      slice-vs-whole call is explicit, not silent.

  - id: wrapped-default-current-vs-last-completed
    question: "Should bare `brag wrapped` (no argument) default to the CURRENT calendar year, or to the LAST-COMPLETED year the way a 'wrapped' idiomatically means a finished period?"
    priority: medium
    status: resolved
    resolution: current-calendar-year
    raised_by: claude
    raised_at: 2026-07-06
    resolved_at: 2026-07-07
    assigned_to: null
    resolution_notes: |
      RESOLVED at SPEC-051 build per orchestrator sign-off: bare `brag
      wrapped` defaults to the CURRENT calendar year (DEC-030 choice 2
      holds as designed). The retrospective/last-completed framing is
      named explicitly by the period argument (`brag wrapped 2025`), and
      `--previous` will add last-completed uniformly across year/quarter
      in SPEC-053 — keeping the "which period" logic in one place rather
      than split between the default and a flag. `TestWrappedCmd_DefaultsToCurrentYear`
      locks the behavior. The DEC-030 revisit trigger stays live: if
      SPEC-053 design or user feedback shows the bare command is expected
      to be retrospective, the default is a localized flip (the
      bounded-window machinery is unaffected).

      UPDATE at SPEC-053 design (2026-07-07): the `--previous` half is
      delivered by SPEC-053 / DEC-032 — the last-completed period is the
      uniform `--previous` modifier across impact/story/wrapped (bare
      `wrapped --previous` = last-completed year). Design did NOT surface
      any expectation that the bare command should be retrospective, so
      the current-calendar-year default HOLDS and the DEC-030 revisit
      trigger is CLOSED (no flip). "Which period" logic stays in the one
      `--previous` mechanism, as intended.

      CONFIRMED at SPEC-053 build (2026-07-07): shipped as designed. Bare
      `brag wrapped` = current calendar year (`TestWrappedCmd_DefaultsToCurrentYear`
      unchanged); `brag wrapped --previous` = last-completed year, byte-
      identical to `brag wrapped 2025` in 2026 (`TestWrappedCmd_PreviousDefaultsToLastYear`).
      No default flip. Entry stays RESOLVED; nothing further to decide.
    notes: |
      Filed at SPEC-051 design (DEC-030 choice 2, confidence 0.72). The
      DEC locks the default to the CURRENT calendar year, leaving the
      last-completed variant to the planned `--previous` modifier
      (SPEC-053, foreseen by DEC-028). Rationale: (1) current-year mirrors
      DEC-028 choice 1's current-in-progress default, keeping the digest
      family consistent; (2) baking last-completed into the default now
      would preempt SPEC-053 and split the period-selection logic across
      two specs. The soft spot: "wrapped" idiomatically evokes the
      finished period (Spotify Wrapped is last year's), so a user could
      reasonably expect bare `brag wrapped` to show the completed year.
      This is DEC-030's first revisit trigger. Resolve when SPEC-053
      (`--previous`) is designed: if `--previous` makes last-completed a
      one-flag away, the current-year default holds; if user feedback
      shows the bare command is expected to be retrospective, flip the
      default there (a localized change — the bounded-window machinery is
      unaffected). Recorded so the default choice is explicit, not silent.
      (Above §14's 0.7 hard threshold, filed proactively per DEC-028's
      precedent of recording the softest sub-choice.)

  - id: sparkline-default-on-and-flat-nonzero-convention
    question: "Is default-on cadence sparkline (block glyphs in the shareable digest, escaped only by --no-spark/NO_COLOR) the right ergonomics across users' real terminals, and is rendering a flat NON-zero series identically to a flat zero one (both all ▁) acceptable, or does min→max need a magnitude-aware variant?"
    priority: medium
    status: resolved
    raised_by: claude
    raised_at: 2026-07-06
    resolved_at: 2026-07-06
    resolved_by: orchestrator sign-off (SPEC-052 build)
    assigned_to: null
    resolution: |
      RESOLVED at SPEC-052 build per orchestrator sign-off:
      DEFAULT-ON WITH ESCAPE. The cadence sparkline renders by default in
      markdown, suppressed by `--no-spark` OR a present `NO_COLOR` env var
      (no-color.org "set-to-any-value" semantics, present-at-all), read
      through the injectable `lookupSparkEnv` package var (DEC-023 LD6
      precedent). Deliberately NOT TTY-gated (DEC-031 D3): the wrapped
      digest is meant to be captured/piped/pasted, so a TTY gate would
      wrongly strip the visual on the non-TTY paths that matter most. The
      FLAT-NONZERO CONVENTION is ACCEPTED as standard sparkline behavior:
      `[3,3,3]` renders `▁▁▁` like `[0,0,0]` — min→max has no magnitude
      reference and the adjacent per-month counts disambiguate; NO
      magnitude-aware variant is added. Both remain reversible ergonomics
      bets, not correctness ones. Paired tests (all green):
      TestWrappedCmd_SparkDefaultOn / _NoSparkFlagSuppresses /
      _NoColorEnvSuppresses / _NoColorEnvEmptyValueSuppresses /
      _JSONHasNoGlyphs / _NoSparkHelpListed, plus the spark package's
      TestLine_NormalizationTable (flat-nonzero row pins the convention).
      Revisit trigger unchanged: if v0.4.0 dogfooding shows real-terminal
      mojibake the escape did not cover, or the flat-nonzero-looks-empty
      case bites in practice, revisit (a TTY-aware default with an explicit
      override, or a magnitude-aware normalization variant) — both are
      localized, additive changes leaving the primitive signature and the
      JSON envelope unaffected.
    notes: |
      Filed at SPEC-052 design (DEC-031, confidence 0.78). The primitive,
      normalization, placement, and JSON-stays-raw are LOCKED and
      byte-verified. Two residual soft spots drag the composite below 0.8:

      (1) DEFAULT-ON ERGONOMICS. Unicode block glyphs (U+2581..U+2588) are
      broadly supported, and default-on is the "fun" the user asked for;
      the escape is `--no-spark` OR a present `NO_COLOR` env var (no-color.org
      "set-to-any-value" semantics), read through the injectable
      `lookupSparkEnv` package var (DEC-023 LD6 precedent). The risk is a
      glyph-hostile terminal rendering mojibake for a user who does not know
      the escape. Deliberately NOT TTY-gated (DEC-031 D3): the wrapped digest
      is meant to be captured/piped/pasted — non-TTY paths where a TTY gate
      would wrongly strip the visual. Reversible and escape-hatched, so this
      is an ergonomics bet, not a correctness one.

      (2) FLAT-NONZERO CONVENTION. min→max normalization has no magnitude
      reference, so a flat non-zero series (e.g. [3,3,3]) renders all ▁ —
      identical to a flat zero series. Rare over a real year/quarter, and the
      adjacent per-month counts disambiguate it, but a user could read a
      steady-3-a-month cadence as "empty." A magnitude-aware variant (absolute
      scale, or flat-nonzero → mid glyph) is the alternative — deferred because
      it needs a second rule min→max deliberately lacks.

      Resolve/harden when the sparkline is dogfooded in the v0.4.0 wrapped
      digest: if a real terminal shows mojibake that the escape did not cover,
      or the flat-nonzero-looks-empty case bites in practice, revisit (add a
      TTY-aware DEFAULT with an explicit override, or a magnitude-aware
      normalization variant). Both are localized, additive changes — the
      primitive's signature and the JSON envelope are unaffected either way.

  - id: memory-slice-fusion-constants
    question: "Are the memory slice's fusion constants (k=60 and equal weights for the recency/relevance/project lists) right for a PERSONAL-scale corpus, given they are TREC-scale defaults applied to hundreds of entries rather than thousands of documents?"
    priority: medium
    status: open
    raised_by: claude-opus-5
    raised_at: 2026-08-08
    assigned_to: null
    notes: |
      Filed at SPEC-073 design (DEC-043, confidence 0.75). The STRUCTURE is
      locked and strong: reciprocal-rank fusion over three ORDINAL lists
      (recency, relevance, project), chosen because Store.List's ordinal
      position and Store.Search's bm25 rank (negative, unbounded,
      corpus-relative) have no shared unit, and because fusing positions
      needs no invented normalization. It degenerates to exactly plain
      recency when no query/project is given, and reads no wall clock at
      all. None of that is in question.

      The CONSTANTS are (sub-decision 2, self-scored 0.55). k=60 is the
      published RRF value (Cormack/Clarke/Buettcher, SIGIR 2009), taken
      BECAUSE it is published — a hand-picked value would be indefensible —
      and the weights are 1.0 each because RRF's premise is that the fused
      lists are peers and no personal corpus tells us otherwise. Both are
      borrowed defaults applied to a corpus two to three orders of
      magnitude smaller than the one they were derived on. Two consequences
      are already visible in the arithmetic and are recorded in DEC-043 as
      accepted negatives:

      (1) k=60 COMPRESSES THE TOP. Ranks 1 and 20 differ by only ~24% of
      their own magnitude, so the ORDER is right but the scores look nearly
      flat to anyone inspecting `--format json`.

      (2) THE PROJECT BOOST IS STRONG. The whole recency term spans
      1/61 -> 0 (~0.0164), so a project term of 1/(60+rank_p) is
      comparable to the ENTIRE recency range — a same-project entry
      effectively outranks a non-project entry of similar relevance almost
      regardless of age. Soft in mechanism (nothing is removed, a strong
      match still competes), close to a hard filter in effect.

      Resolve/harden by dogfooding `brag memory` against this repo's own
      corpus. If the top of the slice reads wrong, or `score` inspection
      shows the ordering is being decided by a term the user did not
      intend, the FIRST move is to lower k (10-20): that sharpens the top
      of a personal-scale corpus AND weakens the project boost relative to
      recency, addressing both consequences at once. The SECOND move is
      unequal weights, which needs a fixture set richer than one hand-built
      corpus to justify. The fallback if the constants prove indefensible
      is DEC-043's Option C (lexicographic tiers) — most explainable, no
      constants at all, at the cost of tunability — NOT Option B (weighted
      linear over normalized components), which trades one borrowed
      constant for two invented ones.

      Every constant is exported (memory.FusionK, memory.WeightRecency /
      WeightMatch / WeightProject) and pinned by byte-exact goldens, so any
      change is a visible golden diff, not a silent behavior change.
      (Above §14's 0.7 hard threshold; filed proactively per DEC-031's
      precedent of recording the softest sub-choice.)

  - id: capture-caps-were-inherited-not-derived
    question: "The capture.Validate field caps (title 200, tags 64, impact 256) were inherited from the add --json schema and never derived from real use — which of them are load-bearing, which are arbitrary, and what shape should they take?"
    priority: medium
    status: open
    raised_by: claude-opus-5
    raised_at: 2026-08-09
    assigned_to: null
    notes: |
      Raised 2026-08-09 from a user report ("Tags have a 64-char limit"), then
      widened when the same pattern turned out to hold for `impact` and
      `title`. Recorded as an open question, NOT a spec: STAGE-019 is
      mid-flight and the placement decision is deliberately deferred. NOT yet
      assigned to a stage.

      THE NUMBERS ARE UNDOCUMENTED. `capture.MaxTitle=200`, `MaxTags=64`,
      `MaxProject=64`, `MaxType=64`, `MaxImpact=256`, `MaxDescription=100000`.
      DEC-012 (`brag add --json`) introduced them and records no rationale for
      any value. SPEC-064 then correctly unified per-path validation — flag and
      editor mode had been skipping the caps that --json and MCP enforced — and
      in doing so generalised those numbers to every ingress path. The side
      effect nobody measured: a large slice of the EXISTING corpus became
      unwritable.

      MEASURED AGAINST THE REAL CORPUS (347 entries), reserved provenance tags
      stripped so only user-supplied text counts:

        field    cap     median   already over cap        max
        impact   256     227      74 of 285  (26%)       1290
        title    200      73      33 of 348   (9%)       1444
        tags      64      --       9 of 260   (3%)         89

      `impact`'s median is 227 of 256 — 89% of the ceiling. That is not a cap
      catching outliers; it is a cap sitting in the middle of ordinary usage,
      and 26% of existing impacts already exceed it.

      MEASUREMENT NOTE (corrected 2026-08-09). An earlier revision of this
      question said "81 of 274 (30%)". That count used `>= 256`, which is wrong:
      the cap ADMITS exactly 256, so the seven entries sitting precisely at the
      boundary are legal. Re-measured with `> 256` on a corpus that has since
      grown: 74 of 285 (26%). Same conclusion, and the median (227) is
      unaffected — but the figure is corrected here rather than left as an
      "alternative reading", because one of the two was simply an off-by-one.

      THE PRIORITY IS INVERTED. `description` gets 100,000 bytes. `impact` —
      the field `brag impact`, `wrapped`, `story` and `memory` all actually
      read, and the one a brag's Reflection-Q4 is transcribed into — gets 256.

      TAGS IS A DIFFERENT SHAPE OF WRONG. MaxTags caps the whole comma-joined
      STRING, not each tag, so it penalises using many tags (a legitimate
      choice) rather than one absurd tag (the actual abuse). DEC-015 normalised
      tags into a `tags` table (`name TEXT NOT NULL UNIQUE`, no length
      constraint), so a joined-string cap is a leftover from DEC-004's
      comma-joined era. The shape the normalised model implies is a per-tag cap
      plus a tag-COUNT cap.

      WHY THIS IS NOT JUST A CONSTANT BUMP — the impact cap is now
      LOAD-BEARING. DEC-044 cites these caps twice (lines ~136 and ~443) for
      the memory slice's budget model: *"the capture.Validate field caps bound
      a single line at 626 bytes / 157 tokens worst case"*, which is the
      argument that one long entry cannot starve a slice. Raising MaxImpact
      moves that worst case, so the budget math and DEC-044's starvation
      argument have to be revisited in the same change. Title and tags are not
      similarly coupled. Single-line rendering (`brag list` TSV, markdown
      tables) is a real constraint on title/impact but argues for SOME cap, not
      for these values.

      WHICH FIELDS ARE ACTUALLY TOO NARROW — measured, so the eventual spec
      does not widen everything reflexively:

        field         cap       median   max     verdict
        impact        256          227   1290    26% over cap — the sharpest
        title         200           73   1444    9% over cap
        tags           64           --     89    3% over, and the WRONG SHAPE
        project        64            9     22    fine, 3x headroom
        type           64            7     10    fine, 6x headroom
        description  100000        570   2071    fine, 48x headroom

      The contrast is the finding. `description` is over-provisioned 48x while
      `impact` is exceeded by 26% of entries. That is not a scale problem to be
      fixed by scaling everything up — each cap was chosen independently with
      no model of what the field is FOR. description is a free-text body nobody
      writes 100k of; impact is the one-line outcome every digest reads, and it
      got a quarter of a kilobyte. Only title/impact/tags need moving.

      A SECOND, DUPLICATED PROJECT-NAME CAP. `internal/cli/project.go:162`
      hard-codes `if len(name) > 64` with the message "project name exceeds
      64-character limit", rather than referencing `capture.MaxProject`. The
      comment directly above it reasons explicitly about keeping the two in
      agreement (DEC-036's soft-match invariant: an ensured name must be able
      to soft-match a normally-added entry, both counting bytes) — which is
      exactly the case where they should be ONE constant, not two a comment
      asks a reader to keep aligned. Same class as the buildFTS5Query /
      buildMatch duplication that DEC-024 recorded and SPEC-074 LD8 finally
      extracted.

      Not biting today: project names max out at 22 bytes and both values
      happen to be 64. But if MaxProject ever moves, this copy silently will
      not. STAGE-018's backlog already carries "`brag project new` name cap" —
      that item is this, and it is now a one-line fix (reference the constant)
      that must travel WITH any change to the caps.

      ORDERING RISK — READ BEFORE ACTIONING THE EDIT PATH. `capture.Validate`
      is currently called from `cli/add.go` (x2), `cli/add_json.go`, and
      mcpserver's `brag_add` — NOT from the edit / `Store.Update` path.
      STAGE-018's backlog already carries "run the edit/`Store.Update` path
      through `internal/capture.Validate`" as a pending item. If that lands
      FIRST, every over-cap entry above becomes uneditable — changing a title
      would require truncating impact or deleting tags, on 26% of the corpus.
      Whichever spec actions the edit-path item must resolve this question in
      the same change, or explicitly grandfather existing rows.
